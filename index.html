<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life.exe">
<title>Life.exe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FFF4E8; overflow: hidden; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          font: 700 22px system-ui, sans-serif; color: #2B1A0E; }
  #boot img { width: 96px; height: 96px; image-rendering: pixelated; border: 4px solid #2B1A0E; }
  #boot a { font: 500 14px system-ui, sans-serif; color: #6E5F55; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .25s; background: transparent; }
  #app.ready { opacity: 1; }
</style>
</head>
<body>
<div id="boot">
  <img src="icon-192.png" alt="">
  <span>LIFE.EXE</span>
  <a id="fallback" href="#" style="visibility: hidden">Nie ładuje się? Otwórz w przeglądarce</a>
</div>
<iframe id="app" title="Life.exe" allow="clipboard-write; fullscreen"></iframe>
<script>
  // Adres Twojej aplikacji z Apps Script (Wdróż → Zarządzaj wdrożeniami). Po wdrożeniu nowej wersji zostaje taki sam.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzrk5Y9OXe6fdiKG_vY8anxjZX560Kk6m6yjiJ7lXPm-ZGI7qqc8TTNpezv7QuNbcaz/exec';
  var f = document.getElementById('app');
  var fb = document.getElementById('fallback');
  fb.href = APP_URL;
  f.addEventListener('load', function () { f.classList.add('ready'); });
  f.src = APP_URL;
  setTimeout(function () { fb.style.visibility = 'visible'; }, 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
